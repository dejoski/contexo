name: Daily puzzle

on:
  schedule:
    # 00:05 ET (04:05 UTC during EDT, 05:05 UTC during EST)
    - cron: "5 4 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for API key
        id: gate
        env:
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
        run: |
          if [ -n "$SPARK_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPARK_API_KEY secret is not set - skipping puzzle generation. Puzzles are pre-generated through 2026-12-12; set the SPARK_API_KEY repo secret to resume automatic generation."
          fi

      - name: Generate next puzzle
        if: steps.gate.outputs.ready == 'true'
        env:
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
        run: python3 scripts/generate_puzzle.py --next

      - name: Commit and push
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "contexo-bot"
          git config user.email "contexo-bot@users.noreply.github.com"
          git add site/data/puzzles/
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Daily puzzle $(date -u +%F)"
            git push
          fi
